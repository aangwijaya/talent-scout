# Undo-cost tiers. ops/gate computes the tier from changed paths: any tier3 match wins,
# all-tier1 stays tier 1, everything else is tier 2.
tier3: [docs/API.md, docs/EVENTS.md, docs/PRD.md, api/openapi.yaml, contract.lock, src/hooks.server.ts, src/lib/server/session.ts, src/lib/server/guards.ts, internal/store/migrations/*, internal/http/middleware/auth*, internal/auth/*, internal/email/*, cmd/migrate/*, cmd/seed/*, config/seed-job.yaml, Dockerfile, vercel.json, .github/*, CLAUDE.md, AGENTS.md, .claude/*, .opencode/*, opencode.json]
tier1: [*.md, docs/*, *.test.ts, *.spec.ts, *.e2e.ts, *_test.go, testdata/*]
# Always allowed outside a node's fence.
always_allowed: [docs/LESSONS.md, pnpm-lock.yaml, go.sum, go.mod, package.json]
# Tiers that merge by themselves into the integration branch after green CI, a review with no High and the
# verifier's `merge` verdict (ADR 0008). Never tier 3, and never while integration_branch is main.
automerge: [1, 2]
# Where nodes start and merge. `dev` once the app repos have it (WORKFLOW.md, "Integration branch and
# releases"); main until then, and nothing merges by itself into main.
integration_branch: main
# Models per agent. Claude works on the client and reviews the server; OpenCode does the reverse.
claude_model: claude-opus-5-5
claude_effort: medium
# deepseek/deepseek-flash is "DeepSeek V4.1 Flash 1017" on the DeepSeek API (opencode models --verbose).
opencode_model: opencode-go/deepseek-v4.1-flash
# OpenCode passes effort as --variant; this model offers low, high, max.
opencode_effort: high
budget_usd: 6
# The agents' reported cost of all runs in one day stays under this (ops/budget.py). The day starts at
# 00:00 in budget_tz. Each run may spend only what is left of it, and never more than budget_usd.
daily_budget_usd: 20
budget_tz: Asia/Jakarta
# When a plan's quota runs out and the message names no reset time, that agent's nodes wait this long.
quota_pause_min: 60
timeout_min: 60
# The independent review gets its own budget, and OpenCode is stopped after this long with no output.
review_timeout_min: 20
# The verifier runs after the review, in its own copy of the branch, and sabotages the tests.
verifier_agent: claude
verify_timeout_min: 30
idle_min: 10
max_attempts: 3
ci_wait_min: 20
# Sandbox (ADR 0002): every agent run and every command on agent code runs in rootless Podman.
sandbox_cpus: 4
sandbox_memory: 6g
sandbox_pids: 1024
# Who acts on GitHub (ADR 0006). legacy: the agent's fine-grained token and the human's gh login.
# apps: installation tokens of the ts-agent and ts-orchestrator GitHub Apps, minted per run, expiring in an hour.
github_identity: legacy
agent_app_id: 0
orchestrator_app_id: 0
# Where the orchestrator's secrets live (ADR 0006). files: plain files under ops/env.
# creds: encrypted with systemd-creds --user under ~/.config/talent-scout-ops/secrets (ops/creds).
secret_store: files
# The service (ops/service, ADR 0007) starts a node only when this GitHub account added its `run` label,
# and only a contract-change whose Decision this account wrote. It looks at GitHub every poll_sec seconds.
human_login: aangwijaya
poll_sec: 90
